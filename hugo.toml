# ==========================================
# 基础配置
# ==========================================
baseURL = 'https://qdx.dpdns.org/'  # 替换为你的实际域名
locale = 'zh-CN'
title = 'qdx的博客'
theme = 'PaperMod'

# ==========================================
# 搜索功能必需配置（必须放在params之前）
# ==========================================
[outputs]
  home = ["HTML", "RSS", "JSON"]  # 生成搜索索引必需

# ==========================================
# 合并后的PaperMod主题配置（唯一的[params]表）
# ==========================================
[params]
  # 原有的基础配置
  author = 'qdx'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  comments = true
  
  # 首页信息配置
  [params.homeInfoParams]
    Title = "Hi there你好呀 👋"
    Content = "欢迎来到qdx的博客"
  

  
  # 搜索功能配置
  enableSearch = true
  
  [params.search]
    enable = true
    limit = 20
    
    # 修复：改为标准TOML表格式，避免多行内联表语法错误
    [params.search.fuseOpts]
      keys = ["title", "content", "summary", "tags", "categories"]
      threshold = 0.3
      location = 0
      distance = 100

  # ==========================================
  # Waline 评论系统配置
  # ==========================================
  [params.waline]
    enable = true
    serverURL = "https://inspiring-unicorn-f8f36a.netlify.app/.netlify/functions/comment"
    placeholder = "欢迎评论~"
    # 登录方式：enable(允许登录)|disable(禁用登录)|force(强制登录)
    login = "enable"
    # 必填项：["nick"] 表示只需要昵称（用户名）
    #        ["nick", "mail"] 表示需要昵称和邮箱
    requiredMeta = ["nick"]
    wordLimit = 0
    pageSize = 10
    upload = true
    emoji = true

# ==========================================
# 导航菜单配置
# ==========================================
[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"          # 指向根目录，也就是首页
  weight = 1         # 权重设为1，排在最左边

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 5

[[menu.main]]
  identifier = "categories"  
  name = "分类"              
  url = "/categories/"    
  weight = 4               

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 5

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 10



