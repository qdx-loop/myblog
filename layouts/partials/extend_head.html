{{- /* 全站通告：已关闭过的访客在首帧就隐藏，避免闪烁（样式见 assets/css/extended/custom.css） */ -}}
{{- with site.Data.notice }}
{{- if and .enabled .text .dismissible }}
<style>.notice-off .site-notice{display:none}</style>
<script>
  try {
    if (localStorage.getItem("notice-dismissed:{{ .id | default "default" }}") === "1") {
      document.documentElement.classList.add("notice-off");
    }
  } catch (e) {}
</script>
{{- end }}
{{- end }}
