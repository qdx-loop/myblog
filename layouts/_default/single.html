{{- define "main" }}
<article class="post" id="main-content">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ partial "meta.html" . }}
  </header>
  <section class="post-content">
    {{ .Content }}
  </section>
  <footer class="post-footer">
    {{ partial "post_nav.html" . }}
  </footer>
</article>

{{ partial "comments.html" . }}
{{- end }}
